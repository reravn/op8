name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: build kernel
    runs-on: ubuntu-22.04
    steps:
      - name: build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/reravn/op8
          kernel-branch: blu_spark-17-custom-ksu
          aosp-clang-version: r547379
          aosp-gcc: true
          aosp-clang: true
          depth: 1
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/Baka-SU/BakaSU
          ccache: true
          config: ksu_defconfig
          arch: arm64
          anykernel3: true
          anykernel3-url: https://github.com/reravn/AnyKernel3
